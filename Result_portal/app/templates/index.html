{% extends 'base.html' %}

{% block title %}Welcome | Student Result Portal{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #0d6efd 0%, #6dd5ed 100%);
    min-height: 100vh;
    background-attachment: fixed;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  html {
    height: 100%;
  }
  .welcome-bg-shape {
    position: fixed;
    top: -60px;
    left: -60px;
    width: 320px;
    height: 320px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    z-index: 0;
    animation: float1 9s ease-in-out infinite alternate;
  }
  .welcome-bg-shape2 {
    position: fixed;
    bottom: -80px;
    right: -80px;
    width: 400px;
    height: 400px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    z-index: 0;
    animation: float2 11s ease-in-out infinite alternate;
  }
  @keyframes float1 {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(30px) scale(1.08); }
    100% { transform: translateY(-15px) scale(0.97); }
  }
  @keyframes float2 {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-30px) scale(1.1); }
    100% { transform: translateY(20px) scale(0.95); }
  }
  .welcome-card {
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.14);
    border-radius: 1.2rem;
    background: rgba(255,255,255,0.97);
    position: relative;
    z-index: 1;
    padding: 2.5rem 2rem 2rem 2rem;
    max-width: 420px;
    width: 100%;
  }
  .welcome-header-icon {
    font-size: 2.5rem;
    color: #0d6efd;
    margin-bottom: 0.6rem;
    display: block;
  }
</style>
<div class="welcome-bg-shape"></div>
<div class="welcome-bg-shape2"></div>
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="welcome-card text-center">
        <span class="welcome-header-icon"><i class="bi bi-mortarboard-fill"></i></span>
        <h1 class="mb-3">Welcome to the Student Result Portal!</h1>
        <p class="lead mb-4">Easily manage and view student results online.</p>
        <div class="d-flex flex-column gap-2">
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-block mb-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
